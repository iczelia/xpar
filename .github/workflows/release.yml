name: Release

on:
  push:
    tags:
      - '*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: true

permissions:
  contents: write

env:
  #  Manual runs supply the version through the tag input.
  XPAR_VERSION: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  #  Package once for all release jobs.
  sources:
    name: Build sources
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install the archivers
        run: |
          sudo apt-get update
          sudo apt-get install -y bzip3 xz-utils zstd zip
          bzip3 --version
          xz --version

      - name: Regenerate the ChangeLog from the git history
        run: |
          contrib/gitlog-to-changelog --format='%s%n%n%b%n' > ChangeLog.tmp
          mv ChangeLog.tmp ChangeLog
          head -20 ChangeLog

      - name: Bootstrap and configure
        run: ./bootstrap && ./configure

      - name: Build the source packages
        run: |
          pkg=$(sed -n 's/^PACKAGE_VERSION = //p' Makefile)
          test "$pkg" = "$XPAR_VERSION" || \
            echo "::warning::tag $XPAR_VERSION but configure.ac says $pkg"
          make VERSION="$XPAR_VERSION" dist
          make VERSION="$XPAR_VERSION" dist-zip
          gzip -dk "xpar-$XPAR_VERSION.tar.gz"
          bzip3 -k "xpar-$XPAR_VERSION.tar"
          zstd -19 -k "xpar-$XPAR_VERSION.tar"
          ls -l "xpar-$XPAR_VERSION".*

      - name: Upload the source package artifact
        uses: actions/upload-artifact@v7
        with:
          name: xpar-${{ env.XPAR_VERSION }}
          if-no-files-found: error
          path: |
            xpar-${{ env.XPAR_VERSION }}.tar
            xpar-${{ env.XPAR_VERSION }}.tar.bz2
            xpar-${{ env.XPAR_VERSION }}.tar.bz3
            xpar-${{ env.XPAR_VERSION }}.tar.gz
            xpar-${{ env.XPAR_VERSION }}.tar.xz
            xpar-${{ env.XPAR_VERSION }}.tar.zst
            xpar-${{ env.XPAR_VERSION }}.zip

  #  Format specification.
  spec:
    name: Build the format specification
    needs: [ sources ]
    runs-on: ubuntu-latest
    steps:
      - name: Download the source package artifact
        uses: actions/download-artifact@v7
        with:
          name: xpar-${{ env.XPAR_VERSION }}

      - name: Install TeX
        run: |
          sudo apt-get update
          #  Scalable fonts required by microtype.
          sudo apt-get install -y latexmk texlive-latex-recommended \
                                  texlive-latex-extra texlive-fonts-recommended \
                                  cm-super lmodern

      - name: Extract the source package
        run: |
          tar --strip-components=1 -mxf "xpar-$XPAR_VERSION.tar.gz"
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Configure and typeset
        run: |
          ./configure
          make docs
          mv doc/xpar-format.pdf "xpar-format-$XPAR_VERSION.pdf"

      - name: Upload the specification artifact
        uses: actions/upload-artifact@v7
        with:
          name: xpar-release-spec-${{ env.XPAR_VERSION }}
          if-no-files-found: error
          path: xpar-format-${{ env.XPAR_VERSION }}.pdf

  #  Statically linked Windows binaries.
  windows:
    name: Build Windows ${{ matrix.target.name }}
    needs: [ sources ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64
            host: x86_64-w64-mingw32
            packages: gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
            extra: ""
          - name: i686
            host: i686-w64-mingw32
            packages: gcc-mingw-w64-i686 binutils-mingw-w64-i686
            extra: ""
          - name: i686-win95
            host: i686-w64-mingw32
            packages: gcc-mingw-w64-i686 binutils-mingw-w64-i686
            extra: "--with-windows-target=win95"
    steps:
      - name: Download the source package artifact
        uses: actions/download-artifact@v7
        with:
          name: xpar-${{ env.XPAR_VERSION }}

      - name: Install the cross-toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.target.packages }}

      - name: Extract the source package
        run: |
          tar --strip-components=1 -mxf "xpar-$XPAR_VERSION.tar.gz"
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Configure
        run: |
          ./configure --host=${{ matrix.target.host }} \
                      CC=${{ matrix.target.host }}-gcc \
                      ${{ matrix.target.extra }} \
                      --bindir=/ --program-suffix=-${{ matrix.target.name }} \
                      CFLAGS="-O2 -g" LDFLAGS=-static

      - name: Make
        run: make -j4 all

      - name: Check the Win95 image
        if: ${{ matrix.target.name == 'i686-win95' }}
        run: |
          file xpar.exe
          make win95-check

      - name: Stage the binary
        run: |
          make DESTDIR="$PWD/output" install-exec
          binary=output/xpar-${{ matrix.target.name }}.exe
          debug=output/xpar-${{ matrix.target.name }}.dbg
          objcopy=${{ matrix.target.host }}-objcopy
          strip=${{ matrix.target.host }}-strip
          "$objcopy" --only-keep-debug "$binary" "$debug"
          "$strip" --strip-all "$binary"
          ( cd output && "$objcopy" \
              --add-gnu-debuglink=xpar-${{ matrix.target.name }}.dbg \
              xpar-${{ matrix.target.name }}.exe )
          if test '${{ matrix.target.name }}' = i686-win95; then
            OBJDUMP=${{ matrix.target.host }}-objdump \
            NM=${{ matrix.target.host }}-nm \
              /bin/bash contrib/check-win95-pe.sh \
              "$binary" config.h "$debug"
          fi
          cp config.h output/config.h
          ls -l output

      - name: Upload the Windows build
        uses: actions/upload-artifact@v7
        with:
          name: xpar-release-win-${{ matrix.target.name }}-${{ env.XPAR_VERSION }}
          if-no-files-found: error
          path: output

  #  Run the complete suite against each exact Windows release image.
  windows-test:
    name: Test Windows ${{ matrix.target.name }}
    needs: [ sources, windows ]
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64
            msystem: UCRT64
            host: x86_64-w64-mingw32
            toolchain: mingw-w64-ucrt-x86_64-gcc
          - name: i686
            msystem: MINGW32
            host: i686-w64-mingw32
            toolchain: mingw-w64-i686-gcc
          - name: i686-win95
            msystem: MINGW32
            host: i686-w64-mingw32
            toolchain: mingw-w64-i686-gcc
    steps:
      - name: Download the source package artifact
        uses: actions/download-artifact@v7
        with:
          name: xpar-${{ env.XPAR_VERSION }}

      - name: Download the Windows build
        uses: actions/download-artifact@v7
        with:
          name: xpar-release-win-${{ matrix.target.name }}-${{ env.XPAR_VERSION }}
          path: target

      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: ${{ matrix.target.msystem }}
          install: >-
            make tar gzip diffutils coreutils grep sed gawk
            ${{ matrix.target.toolchain }}

      - name: Extract the source package
        run: |
          tar --strip-components=1 -mxf "xpar-$XPAR_VERSION.tar.gz"
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Build the test harness
        run: |
          ./configure --build="`sh ./config.guess`" \
                      --host=${{ matrix.target.host }} \
                      CC=${{ matrix.target.host }}-gcc LDFLAGS=-static
          make -j4 test-programs

      - name: Full test suite
        run: |
          binary=`cd target && pwd`/xpar-${{ matrix.target.name }}.exe
          chmod +x "$binary"
          VERBOSE=1 make -j4 check XPAR_TEST_BINARY="$binary"

      - name: Show the test logs
        if: failure()
        run: cat test-suite.log tests/*.log 2>&1 || true

  #  Linux binaries built on the oldest supported image.
  linux:
    name: Build Linux ${{ matrix.target.name }}
    needs: [ sources ]
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64
            runner: ubuntu-22.04
          - name: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - name: Download the source package artifact
        uses: actions/download-artifact@v7
        with:
          name: xpar-${{ env.XPAR_VERSION }}

      - name: Extract the source package
        run: |
          tar --strip-components=1 -mxf "xpar-$XPAR_VERSION.tar.gz"
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Configure
        run: |
          ./configure --bindir=/ --program-suffix=-linux-${{ matrix.target.name }} \
                      CFLAGS="-O2 -g" LDFLAGS=-static

      - name: Make
        run: make -j4 all

      - name: Full test suite
        run: VERBOSE=1 make -j4 check

      - name: Show the test logs
        if: failure()
        run: cat test-suite.log tests/*.log 2>&1 || true

      - name: Stage the binary
        run: |
          make DESTDIR="$PWD/output" install-exec
          binary=output/xpar-linux-${{ matrix.target.name }}
          debug=output/xpar-linux-${{ matrix.target.name }}.dbg
          file "$binary"
          if readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
            echo "release binary has an ELF interpreter" >&2
            exit 1
          fi
          if readelf -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "release binary has dynamic dependencies" >&2
            exit 1
          fi
          objcopy --only-keep-debug "$binary" "$debug"
          strip --strip-all "$binary"
          ( cd output && objcopy \
              --add-gnu-debuglink=xpar-linux-${{ matrix.target.name }}.dbg \
              xpar-linux-${{ matrix.target.name }} )
          ls -l output

      - name: Upload the Linux build
        uses: actions/upload-artifact@v7
        with:
          name: xpar-release-linux-${{ matrix.target.name }}-${{ env.XPAR_VERSION }}
          if-no-files-found: error
          path: output

  #  Statically linked Linux binaries for foreign architectures.
  linux-cross:
    name: Build Linux ${{ matrix.target.arch }}
    needs: [ sources ]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: ppc64le
            host: powerpc64le-linux-gnu
            qemu: ppc64le
            libc: ppc64el
          - arch: riscv64
            host: riscv64-linux-gnu
            qemu: riscv64
            libc: riscv64
            gcc: gcc-14-riscv64-linux-gnu
            cc: riscv64-linux-gnu-gcc-14
            cpu: -cpu rv64,v=true,vext_spec=v1.0,vlen=256,elen=64,zvbc=true
          - arch: s390x
            host: s390x-linux-gnu
            qemu: s390x
            libc: s390x
          - arch: armhf
            host: arm-linux-gnueabihf
            qemu: arm
            libc: armhf
    env:
      QEMU: qemu-${{ matrix.target.qemu }}-static ${{ matrix.target.cpu }}
    steps:
      - name: Download the source package artifact
        uses: actions/download-artifact@v7
        with:
          name: xpar-${{ env.XPAR_VERSION }}

      - name: Install the cross-toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static \
            ${{ matrix.target.gcc || format('gcc-{0}', matrix.target.host) }} \
            libc6-dev-${{ matrix.target.libc }}-cross

      - name: Extract the source package
        run: |
          tar --strip-components=1 -mxf "xpar-$XPAR_VERSION.tar.gz"
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Configure
        run: |
          cc=${{ matrix.target.cc || format('{0}-gcc', matrix.target.host) }}
          ./configure --host=${{ matrix.target.host }} CC=$cc \
                      --bindir=/ \
                      --program-suffix=-linux-${{ matrix.target.arch }} \
                      CFLAGS="-O2 -g" LDFLAGS=-static

      - name: Make
        run: make -j4 all test-programs

      - name: Write the xpar launcher
        run: |
          mkdir qw
          printf '#!/bin/sh\nexec %s "%s" "$@"\n' \
            "$QEMU" "$PWD/xpar" > qw/xpar
          chmod +x qw/xpar
          ./qw/xpar --version

      - name: Full test suite under QEMU
        run: |
          e="XPAR=$PWD/qw/xpar; export XPAR;"
          VERBOSE=1 make -j4 check LOG_COMPILER="$QEMU" \
            TESTS_ENVIRONMENT="$e"

      - name: Show the test logs
        if: failure()
        run: cat test-suite.log tests/*.log 2>&1 || true

      - name: Stage the binary
        run: |
          make DESTDIR="$PWD/output" install-exec
          binary=output/xpar-linux-${{ matrix.target.arch }}
          debug=$binary.dbg
          tools=${{ matrix.target.host }}
          file "$binary"
          if "$tools-readelf" -l "$binary" \
               | grep -q 'Requesting program interpreter'; then
            echo "release binary has an ELF interpreter" >&2
            exit 1
          fi
          if "$tools-readelf" -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "release binary has dynamic dependencies" >&2
            exit 1
          fi
          "$tools-objcopy" --only-keep-debug "$binary" "$debug"
          "$tools-strip" --strip-all "$binary"
          ( cd output && "$tools-objcopy" \
              --add-gnu-debuglink=xpar-linux-${{ matrix.target.arch }}.dbg \
              xpar-linux-${{ matrix.target.arch }} )
          ls -l output

      - name: Upload the cross-built Linux build
        uses: actions/upload-artifact@v7
        with:
          name: xpar-release-linux-${{ matrix.target.arch }}-${{ env.XPAR_VERSION }}
          if-no-files-found: error
          path: output

  #  Unsigned macOS binaries.
  macos:
    name: Build macOS ${{ matrix.target.name }}
    needs: [ sources ]
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: arm64
            runner: macos-latest
          - name: x86_64
            runner: macos-26-intel
    steps:
      - name: Download the source package artifact
        uses: actions/download-artifact@v7
        with:
          name: xpar-${{ env.XPAR_VERSION }}

      - name: Extract the source package
        run: |
          tar --strip-components=1 -mxf "xpar-$XPAR_VERSION.tar.gz"
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Configure
        run: |
          #  Apple does not provide a static libSystem.
          ./configure --bindir=/ --program-suffix=-macos-${{ matrix.target.name }} \
                      CC=clang CFLAGS="-O2 -g"

      - name: Make
        run: make -j4 all

      - name: Full test suite
        run: VERBOSE=1 make -j4 check

      - name: Show the test logs
        if: failure()
        run: cat test-suite.log tests/*.log 2>&1 || true

      - name: Stage the binary
        run: |
          make DESTDIR="$PWD/output" install-exec
          binary=output/xpar-macos-${{ matrix.target.name }}
          dsymutil "$binary" -o "$binary.dSYM"
          strip -S -x "$binary"
          ls -l output

      - name: Upload the macOS build
        uses: actions/upload-artifact@v7
        with:
          name: xpar-release-macos-${{ matrix.target.name }}-${{ env.XPAR_VERSION }}
          if-no-files-found: error
          path: output

  #  MS-DOS binary.
  dos:
    name: Build MS-DOS i386
    needs: [ sources ]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DJGPP_RELEASE: "v3.4"
      DJGPP_GCC: "1220"
      FREEDOS_VERSION: "1.4"
    steps:
      - name: Download the source package artifact
        uses: actions/download-artifact@v7
        with:
          name: xpar-${{ env.XPAR_VERSION }}

      - name: Extract the source package
        run: |
          tar --strip-components=1 -mxf "xpar-$XPAR_VERSION.tar.gz"
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Cache the FreeDOS guest
        uses: actions/cache@v5
        with:
          path: ~/.cache/xpar-freedos
          key: freedos-${{ runner.os }}-${{ runner.arch }}-${{ env.FREEDOS_VERSION }}-${{ hashFiles('contrib/dos/install-freedos.sh') }}

      - name: Install the DJGPP cross-toolchain and FreeDOS guest
        run: |
          #  Required by the prebuilt ar and ranlib.
          sudo apt-get update
          sudo apt-get install -y libfl2 mtools qemu-system-x86 unzip
          guest="$HOME/.cache/xpar-freedos/$FREEDOS_VERSION"
          contrib/dos/install-freedos.sh "$guest"
          echo "FREEDOS_ROOT=$guest/share/xpar-dos" >> "$GITHUB_ENV"
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
          curl -fL -o /tmp/djgpp.tar.bz2 \
            "https://github.com/andrewwutw/build-djgpp/releases/download/${DJGPP_RELEASE}/djgpp-linux64-gcc${DJGPP_GCC}.tar.bz2"
          tar -xjf /tmp/djgpp.tar.bz2 -C "$HOME"
          echo "$HOME/djgpp/bin" >> "$GITHUB_PATH"

      - name: Build for MS-DOS
        run: |
          mkdir build-dos
          ( cd build-dos && ../configure --host=i586-pc-msdosdjgpp \
                  --disable-simd --bindir=/ --program-suffix=-dos \
                  CC=i586-pc-msdosdjgpp-gcc CFLAGS="-O2 -g" \
              && make -j4 all \
              && make -j4 test-programs )

      #  objdump provides a stable BFD target name.
      - name: Verify the DOS binary format
        run: |
          file build-dos/xpar.exe
          i586-pc-msdosdjgpp-objdump -f build-dos/xpar.exe
          i586-pc-msdosdjgpp-objdump -f build-dos/xpar.exe \
            | grep -q 'coff-go32-exe'

      - name: Full C suite in FreeDOS
        run: |
          sh contrib/dos/run-suite.sh build-dos "$FREEDOS_ROOT" \
             "$RUNNER_TEMP/dos-suite"

      - name: Show the test logs
        if: failure()
        run: cat "$RUNNER_TEMP"/dos-suite/*.log 2>&1 || true

      - name: Stage the binary
        run: |
          make -C build-dos DESTDIR="$PWD/output" install-exec
          i586-pc-msdosdjgpp-objcopy --only-keep-debug \
            output/xpar-dos.exe output/xpar-dos.dbg
          i586-pc-msdosdjgpp-strip --strip-all output/xpar-dos.exe
          ( cd output && i586-pc-msdosdjgpp-objcopy \
              --add-gnu-debuglink=xpar-dos.dbg xpar-dos.exe )
          ls -l output

      - name: Upload the DOS build
        uses: actions/upload-artifact@v7
        with:
          name: xpar-release-dos-i386-${{ env.XPAR_VERSION }}
          if-no-files-found: error
          path: output

  #  Publish once, after every binary has been built and tested.
  publish:
    name: Publish the release
    needs: [ sources, spec, windows-test, linux, linux-cross, macos, dos ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Install the zip archiver
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Assemble the release
        run: |
          mkdir release debug

          cp "artifacts/xpar-$XPAR_VERSION/xpar-$XPAR_VERSION".* release/
          cp "artifacts/xpar-release-spec-$XPAR_VERSION/xpar-format-$XPAR_VERSION.pdf" release/

          cp "artifacts/xpar-release-win-x86_64-$XPAR_VERSION/xpar-x86_64.exe" release/
          cp "artifacts/xpar-release-win-i686-$XPAR_VERSION/xpar-i686.exe" release/
          cp "artifacts/xpar-release-win-i686-win95-$XPAR_VERSION/xpar-i686-win95.exe" release/
          cp "artifacts/xpar-release-linux-x86_64-$XPAR_VERSION/xpar-linux-x86_64" release/
          cp "artifacts/xpar-release-linux-aarch64-$XPAR_VERSION/xpar-linux-aarch64" release/
          cp "artifacts/xpar-release-linux-ppc64le-$XPAR_VERSION/xpar-linux-ppc64le" release/
          cp "artifacts/xpar-release-linux-riscv64-$XPAR_VERSION/xpar-linux-riscv64" release/
          cp "artifacts/xpar-release-linux-s390x-$XPAR_VERSION/xpar-linux-s390x" release/
          cp "artifacts/xpar-release-linux-armhf-$XPAR_VERSION/xpar-linux-armhf" release/
          cp "artifacts/xpar-release-macos-arm64-$XPAR_VERSION/xpar-macos-arm64" release/
          cp "artifacts/xpar-release-macos-x86_64-$XPAR_VERSION/xpar-macos-x86_64" release/
          cp "artifacts/xpar-release-dos-i386-$XPAR_VERSION/xpar-dos.exe" release/

          cp artifacts/xpar-release-win-*-"$XPAR_VERSION"/*.dbg debug/
          cp artifacts/xpar-release-linux-*-"$XPAR_VERSION"/*.dbg debug/
          cp artifacts/xpar-release-dos-i386-"$XPAR_VERSION"/*.dbg debug/
          cp -R artifacts/xpar-release-macos-*-"$XPAR_VERSION"/*.dSYM debug/

          test "$(find debug -name '*.dbg' -type f | wc -l)" -eq 10
          test "$(find debug -name '*.dSYM' -type d | wc -l)" -eq 2
          ( cd debug && zip -9 -r \
              "../release/xpar-$XPAR_VERSION-debug-symbols.zip" . )

          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 21
          ls -l release

      - name: Upload the complete release artifact
        uses: actions/upload-artifact@v7
        with:
          name: xpar-release-${{ env.XPAR_VERSION }}
          if-no-files-found: error
          path: release

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.XPAR_VERSION }}
          overwrite_files: true
          files: release/*

      - name: Remove separately published debug symbols
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=$(gh release view "$XPAR_VERSION" --json assets \
            --jq '.assets[].name')
          for asset in \
            xpar-x86_64.dbg xpar-i686.dbg xpar-i686-win95.dbg \
            xpar-linux-x86_64.dbg xpar-linux-aarch64.dbg \
            xpar-linux-ppc64le.dbg xpar-linux-riscv64.dbg \
            xpar-linux-s390x.dbg xpar-linux-armhf.dbg xpar-dos.dbg \
            xpar-macos-arm64.dSYM.zip xpar-macos-x86_64.dSYM.zip
          do
            printf '%s\n' "$assets" | grep -Fxq "$asset" || continue
            gh release delete-asset "$XPAR_VERSION" "$asset" --yes
          done
