name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  #  Build every target from the same source package.
  dist:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap and configure
        run: ./bootstrap && ./configure

      - name: Make source package
        run: make VERSION=${{ github.sha }} dist-gzip

      - name: Upload source package artifact
        uses: actions/upload-artifact@v7
        with:
          name: xpar-${{ github.sha }}
          path: xpar-${{ github.sha }}.tar.gz

      - name: Run distcheck
        run: make distcheck

      #  Fixture read by every runnable target.
      - name: Write the cross-host compatibility fixture
        run: |
          make -j4 all
          mkdir compat
          cd compat
          head -c 1200000 /dev/urandom > corpus.bin
          ../xpar create --layout=armoured -r 20% -o compat corpus.bin

      - name: Upload compatibility fixture
        uses: actions/upload-artifact@v7
        with:
          name: xpar-compat-${{ github.sha }}
          path: compat

  #  Linux compiler, SIMD, thread, and sanitizer matrix.
  linux:
    name: Linux ${{ matrix.cc }} ${{ matrix.simd }} ${{ matrix.threads }} ${{ matrix.san }}
    needs: [ dist ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
        simd: [ enable-simd, disable-simd ]
        threads: [ enable-threads, disable-threads ]
        san: [ none, sanitized ]
    env:
      ASAN_OPTIONS: abort_on_error=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Download source package artifact
        uses: actions/download-artifact@v7
        with:
          name: xpar-${{ github.sha }}
      - name: Download compatibility fixture
        uses: actions/download-artifact@v7
        with:
          name: xpar-compat-${{ github.sha }}
          path: compat

      - name: Extract source package
        run: |
          tar --strip-components=1 -mxf xpar-${{ github.sha }}.tar.gz
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Configure
        run: |
          if [ "${{ matrix.san }}" = none ]; then
            ./configure CC=${{ matrix.cc }} \
              --${{ matrix.simd }} --${{ matrix.threads }}
          else
            ./configure CC=${{ matrix.cc }} \
              --${{ matrix.simd }} --${{ matrix.threads }} \
              --enable-sanitizers=address,undefined CFLAGS="-O1 -g"
          fi

      - name: Make
        run: make -j4 all

      - name: Test suite
        run: VERBOSE=1 make -j4 check
        env:
          XPAR_COMPAT: ${{ github.workspace }}/compat

      - name: Show the test logs
        if: failure()
        run: cat test-suite.log tests/*.log 2>&1 || true

  #  aarch64 SIMD on native hardware.
  linux-aarch64:
    name: Linux aarch64 ${{ matrix.cc }} ${{ matrix.simd }} ${{ matrix.san }}
    needs: [ dist ]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        cc: [ gcc, clang ]
        simd: [ enable-simd, disable-simd ]
        san: [ none, sanitized ]
    env:
      ASAN_OPTIONS: abort_on_error=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Download source package artifact
        uses: actions/download-artifact@v7
        with:
          name: xpar-${{ github.sha }}
      - name: Download compatibility fixture
        uses: actions/download-artifact@v7
        with:
          name: xpar-compat-${{ github.sha }}
          path: compat

      - name: Extract source package
        run: |
          tar --strip-components=1 -mxf xpar-${{ github.sha }}.tar.gz
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Configure
        run: |
          if [ "${{ matrix.san }}" = none ]; then
            ./configure CC=${{ matrix.cc }} --${{ matrix.simd }}
          else
            ./configure CC=${{ matrix.cc }} --${{ matrix.simd }} \
              --enable-sanitizers=address,undefined CFLAGS="-O1 -g"
          fi

      - name: Make
        run: make -j4 all

      - name: Test suite
        run: VERBOSE=1 make -j4 check
        env:
          XPAR_COMPAT: ${{ github.workspace }}/compat

      #  Ensure clmul-neon is dispatched on its only runner.
      - name: Differential kernel check
        if: matrix.simd == 'enable-simd'
        run: |
          ./xpar benchmark --tiers > tiers.log 2>&1 || {
            cat tiers.log;  exit 1;
          }
          cat tiers.log
          grep -Eq 'gf tier clmul-neon +ok' tiers.log \
            || { echo "gf tier clmul-neon was never dispatched"; exit 1; }

      - name: Show the test logs
        if: failure()
        run: cat test-suite.log tests/*.log 2>&1 || true

  #  macOS on both architectures.
  macos:
    name: macOS ${{ matrix.os }} ${{ matrix.simd }} ${{ matrix.san }}
    needs: [ dist ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, macos-26-intel ]
        simd: [ enable-simd, disable-simd ]
        san: [ none, sanitized ]
        #  Linux already covers scalar sanitizer builds.
        exclude:
          - simd: disable-simd
            san: sanitized
    env:
      ASAN_OPTIONS: abort_on_error=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Download source package artifact
        uses: actions/download-artifact@v7
        with:
          name: xpar-${{ github.sha }}
      - name: Download compatibility fixture
        uses: actions/download-artifact@v7
        with:
          name: xpar-compat-${{ github.sha }}
          path: compat

      - name: Extract source package
        run: |
          tar --strip-components=1 -mxf xpar-${{ github.sha }}.tar.gz
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Configure
        run: |
          if [ "${{ matrix.san }}" = none ]; then
            ./configure CC=clang --${{ matrix.simd }}
          else
            ./configure CC=clang --${{ matrix.simd }} \
              --enable-sanitizers=address,undefined CFLAGS="-O1 -g"
          fi

      - name: Make
        run: make -j4 all

      - name: Test suite
        run: VERBOSE=1 make -j4 check
        env:
          XPAR_COMPAT: ${{ github.workspace }}/compat

      - name: Show the test logs
        if: failure()
        run: cat test-suite.log tests/*.log 2>&1 || true

  #  Native 32- and 64-bit Windows through MSYS2.
  windows:
    name: Windows ${{ matrix.msystem }}
    needs: [ dist ]
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: UCRT64
            toolchain: mingw-w64-ucrt-x86_64-gcc
            host: x86_64-w64-mingw32
          - msystem: MINGW32
            toolchain: mingw-w64-i686-gcc
            host: i686-w64-mingw32
    steps:
      - name: Download source package artifact
        uses: actions/download-artifact@v7
        with:
          name: xpar-${{ github.sha }}
      - name: Download compatibility fixture
        uses: actions/download-artifact@v7
        with:
          name: xpar-compat-${{ github.sha }}
          path: compat

      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: ${{ matrix.msystem }}
          install: >-
            make tar gzip diffutils coreutils grep sed gawk
            ${{ matrix.toolchain }}

      - name: Extract source package
        run: |
          tar --strip-components=1 -mxf xpar-${{ github.sha }}.tar.gz
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Configure
        run: |
          ./configure --build="`sh ./config.guess`" \
                      --host=${{ matrix.host }} \
                      CC=${{ matrix.host }}-gcc LDFLAGS=-static

      - name: Make
        run: make -j4 all

      - name: Test suite
        run: VERBOSE=1 make -j4 check
        env:
          XPAR_COMPAT: compat

      - name: Show the test logs
        if: failure()
        run: cat test-suite.log tests/*.log 2>&1 || true

  #  Cross-build Windows binaries; the next job runs them.
  windows-cross:
    name: Windows cross ${{ matrix.target.name }}
    needs: [ dist ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64
            host: x86_64-w64-mingw32
            packages: gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
            extra: ""
          - name: i686
            host: i686-w64-mingw32
            packages: gcc-mingw-w64-i686 binutils-mingw-w64-i686
            extra: ""
          - name: i686-win95
            host: i686-w64-mingw32
            packages: gcc-mingw-w64-i686 binutils-mingw-w64-i686
            extra: "--with-windows-target=win95"
    steps:
      - name: Download source package artifact
        uses: actions/download-artifact@v7
        with:
          name: xpar-${{ github.sha }}

      - name: Install the cross-toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.target.packages }}

      - name: Extract source package
        run: |
          tar --strip-components=1 -mxf xpar-${{ github.sha }}.tar.gz
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Configure
        run: |
          ./configure --host=${{ matrix.target.host }} \
                      CC=${{ matrix.target.host }}-gcc \
                      ${{ matrix.target.extra }} \
                      CFLAGS=-O2 LDFLAGS=-static

      - name: Make
        run: make -j4 all

      #  Audit the Win95 PE headers and imports; `file` is diagnostic only.
      - name: Verify the PE image is a Win95-era binary
        if: ${{ matrix.target.name == 'i686-win95' }}
        run: |
          file xpar.exe
          make win95-check

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: xpar-win-${{ matrix.target.name }}-${{ github.sha }}
          path: xpar.exe

  #  Run the cross-built binaries on Windows.
  windows-cross-test:
    name: Windows run ${{ matrix.name }}
    needs: [ dist, windows-cross ]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        name: [ x86_64, i686, i686-win95 ]
    steps:
      - name: Download source package artifact
        uses: actions/download-artifact@v7
        with:
          name: xpar-${{ github.sha }}
      - name: Download compatibility fixture
        uses: actions/download-artifact@v7
        with:
          name: xpar-compat-${{ github.sha }}
          path: compat
      - name: Download the cross-built binary
        uses: actions/download-artifact@v7
        with:
          name: xpar-win-${{ matrix.name }}-${{ github.sha }}
          path: bin

      #  Extract the test script; nothing is built here.
      - name: Extract source package
        run: tar --strip-components=1 -mxf xpar-${{ github.sha }}.tar.gz

      - name: Sanity check
        run: |
          chmod +x bin/xpar.exe
          sh contrib/ci-check.sh ./bin/xpar.exe compat


  #  Foreign architectures under qemu-user, including big-endian s390x.
  #  Assert each target's configured and dispatched SIMD tiers.
  cross:
    name: Cross ${{ matrix.target.arch }}
    needs: [ dist ]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: ppc64le
            host: powerpc64le-linux-gnu
            qemu: ppc64le
            libc: ppc64el
            #  The default qemu model exposes VSX through AT_HWCAP.
            macros: HAVE_VSX
            tiers: vsx
            force: vsx
          - arch: riscv64
            host: riscv64-linux-gnu
            qemu: riscv64
            libc: riscv64
            #  Zvbc intrinsics require GCC 14.
            gcc: gcc-14-riscv64-linux-gnu
            cc: riscv64-linux-gnu-gcc-14
            #  QEMU before 9.1 reports V but not Zvbc through riscv_hwprobe.
            cpu: -cpu rv64,v=true,vext_spec=v1.0,vlen=256,elen=64,zvbc=true
            cpu2: rv64,v=true,vext_spec=v1.0,vlen=128,elen=64,zvbc=true
            macros: HAVE_RVV HAVE_RVV_CLMUL
            tiers: rvv-shuffle
            force: rvv-shuffle
          - arch: aarch64
            host: aarch64-linux-gnu
            qemu: aarch64
            libc: arm64
            #  QEMU's max CPU is the only SVE runner.
            cpu: -cpu max
            cpu2: max,sve-default-vector-length=16
            macros: HAVE_NEON HAVE_PMULL HAVE_SVE HAVE_ARM_CRC32
            tiers: neon clmul-neon sve
            force: sve
          - arch: s390x
            host: s390x-linux-gnu
            qemu: s390x
            libc: s390x
          - arch: armhf
            host: arm-linux-gnueabihf
            qemu: arm
            libc: armhf
    env:
      QEMU: qemu-${{ matrix.target.qemu }}-static ${{ matrix.target.cpu }}
    steps:
      - name: Download source package artifact
        uses: actions/download-artifact@v7
        with:
          name: xpar-${{ github.sha }}
      - name: Download compatibility fixture
        uses: actions/download-artifact@v7
        with:
          name: xpar-compat-${{ github.sha }}
          path: compat

      - name: Install the cross-toolchain and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static \
            ${{ matrix.target.gcc || format('gcc-{0}', matrix.target.host) }} \
            libc6-dev-${{ matrix.target.libc }}-cross

      - name: Extract source package
        run: |
          tar --strip-components=1 -mxf xpar-${{ github.sha }}.tar.gz
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      - name: Configure
        run: |
          cc=${{ matrix.target.cc || format('{0}-gcc', matrix.target.host) }}
          ./configure --host=${{ matrix.target.host }} CC=$cc \
                      CFLAGS=-O2 LDFLAGS=-static

      - name: Make
        run: make -j4 all

      #  Fail if an expected SIMD probe disappears.
      - name: Verify the expected tiers were configured
        run: |
          for m in ${{ matrix.target.macros }}; do
            grep -q "^#define $m " config.h \
              || { echo "config.h has no $m"; exit 1; }
          done

      #  Invoke qemu directly; do not depend on binfmt_misc.
      - name: Write the qemu launchers
        run: |
          file xpar
          mkdir qw
          for t in xpar tests/mkdata tests/damage tests/forge; do
            n=`basename "$t"`
            printf '#!/bin/sh\nexec %s "%s" "$@"\n' "$QEMU" "$PWD/$t" > "qw/$n"
            chmod +x "qw/$n"
          done
          ./qw/xpar --version

      #  Exclude bench.sh: its timeit path bypasses the qemu launchers.
      - name: Test suite under qemu
        run: |
          t='tests/t_unit tests/t_codec tests/t_central tests/central.sh'
          t="$t tests/faults.sh tests/safety.sh tests/sanity.sh"
          t="$t tests/build.sh tests/regress.sh"
          e="XPAR=$PWD/qw/xpar; export XPAR;"
          e="$e MKDATA=$PWD/qw/mkdata; export MKDATA;"
          e="$e DAMAGE=$PWD/qw/damage; export DAMAGE;"
          e="$e FORGE=$PWD/qw/forge; export FORGE;"
          make -j4 check VERBOSE=1 TESTS="$t" LOG_COMPILER="$QEMU" \
                                   TESTS_ENVIRONMENT="$e"
        env:
          XPAR_COMPAT: ${{ github.workspace }}/compat

      - name: Show the test logs
        if: failure()
        run: cat test-suite.log tests/*.log 2>&1 || true

      #  Compare every dispatched vector kernel with scalar output.
      - name: Differential kernel check under qemu
        run: |
          ./qw/xpar benchmark --tiers > tiers.log 2>&1 || {
            cat tiers.log;  exit 1;
          }
          cat tiers.log
          grep -q 'tiers agree with scalar' tiers.log \
            || { echo "no differential summary was printed"; exit 1; }
          for k in ${{ matrix.target.tiers }}; do
            grep -Eq "gf tier $k +ok" tiers.log \
              || { echo "gf tier $k was never dispatched"; exit 1; }
          done

      #  Force one tier so missing dispatch fails.
      - name: Round-trip on the ${{ matrix.target.force }} tier
        if: matrix.target.force
        run: |
          head -c 900000 /dev/urandom > forced.bin
          cp forced.bin forced.orig
          ./qw/xpar create --simd=${{ matrix.target.force }} -r 25% \
                    -o forced forced.bin
          dd if=/dev/urandom of=forced.bin bs=1 seek=100000 count=64 \
             conv=notrunc 2> /dev/null
          ./qw/xpar repair --simd=${{ matrix.target.force }} \
                    --in-place forced.xpa
          cmp forced.bin forced.orig

      #  Exercise vector-length-agnostic kernels at a second length.
      - name: Differential kernel check at a second vector length
        if: matrix.target.cpu2
        run: |
          qemu-${{ matrix.target.qemu }}-static \
            -cpu ${{ matrix.target.cpu2 }} ./xpar benchmark --tiers

  #  Run the DJGPP build under DOSBox-X and verify cross-host compatibility.
  dos:
    name: MS-DOS i386 (DJGPP, under DOSBox-X)
    needs: [ dist ]
    runs-on: ubuntu-latest
    env:
      DJGPP_RELEASE: "v3.4"
      DJGPP_GCC: "1220"
    steps:
      - name: Download source package artifact
        uses: actions/download-artifact@v7
        with:
          name: xpar-${{ github.sha }}

      - name: Install the DJGPP cross-toolchain, DOSBox-X and CWSDPMI
        run: |
          #  The prebuilt ar and ranlib require the flex runtime.
          sudo apt-get update
          sudo apt-get install -y libfl2 dosbox-x unzip
          curl -fL -o /tmp/djgpp.tar.bz2 \
            "https://github.com/andrewwutw/build-djgpp/releases/download/${DJGPP_RELEASE}/djgpp-linux64-gcc${DJGPP_GCC}.tar.bz2"
          tar -xjf /tmp/djgpp.tar.bz2 -C "$HOME"
          echo "$HOME/djgpp/bin" >> $GITHUB_PATH
          #  DOSBox-X needs CWSDPMI to run a go32 image.
          curl -fL -o /tmp/csdpmi.zip \
            http://www.delorie.com/pub/djgpp/current/v2misc/csdpmi7b.zip
          unzip -j -o -d "$HOME/csdpmi" /tmp/csdpmi.zip 'bin/CWSDPMI.EXE'
          echo "CWSDPMI=$HOME/csdpmi/CWSDPMI.EXE" >> $GITHUB_ENV

      - name: Extract source package
        run: |
          tar --strip-components=1 -mxf xpar-${{ github.sha }}.tar.gz
          sleep 1
          touch aclocal.m4 configure config.h.in Makefile.in

      #  The native build creates and verifies the cross-host corpus.
      - name: Build for MS-DOS and for this host
        run: |
          mkdir build-dos build-native
          ( cd build-dos && ../configure --host=i586-pc-msdosdjgpp --disable-simd \
                                         CC=i586-pc-msdosdjgpp-gcc CFLAGS=-O2 \
              && make -j4 )
          ( cd build-native && ../configure && make -j4 )

      #  Use objdump's stable BFD target name for the assertion.
      - name: Verify the DOS binary format
        run: |
          file build-dos/xpar.exe
          i586-pc-msdosdjgpp-objdump -f build-dos/xpar.exe
          i586-pc-msdosdjgpp-objdump -f build-dos/xpar.exe | grep -q 'coff-go32-exe'

      - name: Run the MS-DOS check under DOSBox-X
        run: |
          sh contrib/dos/run-check.sh build-dos/xpar.exe build-native/xpar \
             "$CWSDPMI" "$RUNNER_TEMP/dos-check"

      - name: Upload the DOS transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xpar-dos-transcript-${{ github.sha }}
          path: ${{ runner.temp }}/dos-check/out
          if-no-files-found: ignore

  docs:
    name: Format specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install TeX
        run: |
          sudo apt-get update
          #  Scalable fonts required by microtype.
          sudo apt-get install -y latexmk texlive-latex-recommended \
                                  texlive-latex-extra texlive-fonts-recommended \
                                  cm-super lmodern

      - name: Bootstrap and configure
        run: ./bootstrap && ./configure

      - name: Typeset
        run: make docs

      - name: Upload the specification
        uses: actions/upload-artifact@v7
        with:
          name: xpar-format-${{ github.sha }}
          path: doc/xpar-format.pdf
