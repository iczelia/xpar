# Expanded by contrib/dos/run-check.sh for the MS-DOS check.
[sdl]
output=surface
autolock=false

[dosbox]
memsize=32

[cpu]
core=normal
cycles=max

[dos]
# Staging and volume names require long-filename support.
lfn=true
ver=7.1

[mixer]
nosound=true

[speaker]
pcspeaker=false
tandy=off
disney=false
ps1audio=off

[ide, primary]
int13fakeio=false
int13fakev86io=false

[autoexec]
mount d "@WORK@"
mount e "@OUT@"
d:
call ci-check.bat
exit
